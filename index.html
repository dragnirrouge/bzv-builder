<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BZV Prompt-to-Site Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bzv: { bg: "#0a0a0f", card: "#12121a", border: "#1f1f2e", accent: "#6366f1", accent2: "#a855f7" },
        },
      },
    },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; }
  .glass { background: rgba(18,18,26,0.7); backdrop-filter: blur(12px); }
  .glow { box-shadow: 0 0 40px -10px rgba(99,102,241,0.5); }
  .gradient-text { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .fade-in { animation: fadeIn 0.5s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="bg-bzv-bg text-slate-100 min-h-screen">
<header class="border-b border-bzv-border glass sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-bzv-accent to-bzv-accent2 flex items-center justify-center font-black">B</div>
      <div><h1 class="font-bold">BZV Prompt-to-Site</h1><p class="text-[10px] text-slate-500">Brazzaville · Builder IA - FIXED</p></div>
    </div>
    <span class="text-[10px] px-2 py-1 rounded-full bg-green-500/20 text-green-300">✓ Bug cfg corrigé</span>
  </div>
</header>
<main class="max-w-7xl mx-auto px-4 py-8">
  <section class="text-center mb-8">
    <h2 class="text-3xl md:text-5xl font-black mb-3">Crée ton site web en <span class="gradient-text">30 secondes</span></h2>
    <p class="text-slate-400">Décris ton idée, notre IA génère un site complet</p>
  </section>
  <section class="bg-bzv-card border border-bzv-border rounded-2xl p-5 mb-6 glow">
    <label class="block text-sm font-semibold mb-2">✏️ Décris le site que tu veux créer</label>
    <textarea id="promptInput" rows="4" placeholder="Ex: Site pour Mak de Luxe boutique de bijoux or et noir, livraison Brazzaville..." class="w-full bg-bzv-bg border border-bzv-border rounded-xl p-4 text-sm outline-none focus:border-bzv-accent"></textarea>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
      <select id="siteType" class="w-full bg-bzv-bg border border-bzv-border rounded-xl px-4 py-2.5 text-sm"><option value="Boutique" selected>🛍️ Boutique</option><option value="Business">💼 Business</option><option value="Restaurant">🍽️ Restaurant</option><option value="Eglise">⛪ Église</option><option value="Portfolio">🎨 Portfolio</option><option value="Immobilier">🏠 Immobilier</option></select>
      <button id="generateBtn" onclick="generateSite()" class="w-full py-3 rounded-xl bg-gradient-to-r from-bzv-accent to-bzv-accent2 font-bold text-sm">✨ GÉNÉRER LE SITE</button>
    </div>
    <div id="progressBar" class="hidden mt-4"><div class="flex justify-between text-xs mb-1"><span id="progressLabel">...</span><span id="progressPercent">0%</span></div><div class="w-full h-2 bg-bzv-bg rounded-full overflow-hidden"><div id="progressFill" class="h-full bg-gradient-to-r from-bzv-accent to-bzv-accent2 transition-all" style="width:0%"></div></div></div>
  </section>
  <section id="previewSection" class="hidden mb-6">
    <div class="bg-bzv-card border border-bzv-border rounded-2xl overflow-hidden">
      <div class="flex justify-between px-4 py-3 border-b border-bzv-border bg-bzv-bg/50"><span class="text-xs text-slate-400" id="previewUrl">apercu.bzv.app</span><div class="flex gap-2"><button onclick="openPreviewFullscreen()" class="text-xs px-3 py-1 rounded-lg bg-bzv-bg border border-bzv-border">🔍 Plein écran</button><button onclick="downloadHTML()" class="text-xs px-3 py-1 rounded-lg bg-bzv-bg border border-bzv-border">💾 index.html</button></div></div>
      <iframe id="sitePreview" class="w-full h-[700px] bg-white" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </section>
  <section id="deploy" class="hidden mb-8">
    <div class="bg-bzv-card border border-bzv-border rounded-2xl p-6 text-center"><h3 class="text-xl font-black mb-2">🌍 Site prêt !</h3><button onclick="downloadHTML()" class="px-6 py-2 rounded-lg bg-gradient-to-r from-bzv-accent to-bzv-accent2 text-sm font-bold">📥 Télécharger index.html</button></div>
  </section>
</main>
<div id="toast" class="hidden fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl bg-bzv-card border shadow-2xl text-sm"></div>
<script>
const state={html:"",prompt:"",siteType:""};
function toast(msg,type="info"){const el=document.getElementById("toast");el.textContent=msg;el.className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl bg-bzv-card border shadow-2xl text-sm fade-in";el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),3500)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function updateProgress(pct,label){document.getElementById("progressBar").classList.remove("hidden");document.getElementById("progressFill").style.width=pct+"%";document.getElementById("progressPercent").textContent=pct+"%";document.getElementById("progressLabel").textContent=label}

const TYPE_CONFIG={
  Business:{emoji:"💼",tagline:"Solutions professionnelles",features:[{icon:"📊",title:"Stratégie",desc:"Croissance mesurable"},{icon:"🤝",title:"Partenariats",desc:"Réseau Congo"},{icon:"💡",title:"Innovation",desc:"Idées qui transforment"}],cta:"Nous contacter",colors:"from-indigo-600 to-violet-600"},
  Boutique:{emoji:"🛍️",tagline:"L'éclat du luxe à Brazzaville",features:[{icon:"🚚",title:"Livraison 24h",desc:"Brazzaville & Pointe-Noire"},{icon:"💳",title:"Mobile Money",desc:"MTN & Airtel Money"},{icon:"⭐",title:"Or garanti",desc:"Qualité vérifiée"}],cta:"Voir la collection",colors:"from-amber-500 to-orange-600"},
  Restaurant:{emoji:"🍽️",tagline:"Saveurs authentiques",features:[{icon:"🍲",title:"Cuisine locale",desc:"Poulet moambé"},{icon:"🌿",title:"Frais du jour",desc:"Ingrédients"},{icon:"🎉",title:"Événements",desc:"Privatisation"}],cta:"Réserver",colors:"from-orange-600 to-red-600"},
  Eglise:{emoji:"⛪",tagline:"Communauté de foi",features:[{icon:"📖",title:"Enseignements",desc:"Dimanche 9h"},{icon:"🙏",title:"Prières",desc:"Mercredi 18h"},{icon:"👨‍👩‍👧",title:"Famille",desc:"Activités"}],cta:"Nous rejoindre",colors:"from-violet-600 to-purple-600"},
  Portfolio:{emoji:"🎨",tagline:"Créativité",features:[{icon:"💻",title:"Design",desc:"Moderne"},{icon:"📱",title:"Dév",desc:"Web & mobile"},{icon:"🚀",title:"Livraison",desc:"Rapide"}],cta:"Voir projets",colors:"from-cyan-500 to-blue-600"},
  Immobilier:{emoji:"🏠",tagline:"Votre chez-vous",features:[{icon:"🏘️",title:"Locations",desc:"Appartements"},{icon:"🔑",title:"Ventes",desc:"Biens"},{icon:"📋",title:"Accompagnement",desc:"De A à Z"}],cta:"Voir biens",colors:"from-emerald-600 to-teal-600"}
};
function getUnsplashPhotoId(type,i){
  const map={Boutique:["1617038260892-41a1f14a8ca0","1599643478518-a784e5dc4c8f","1515562141207-7a88fb7ce338"],Business:["1497366216548-37526070297c","1556761175-5973dc0f32e7","1552664730-d307ca884978"],Restaurant:["1414235077428-338989a2e8c0","1517248135467-4c7edcad34c4","1555396273-367ea4eb4db5"]};
  const arr=map[type]||map.Business;return arr[i%arr.length];
}
function generateSiteHTML(prompt,type){
  const cfg=TYPE_CONFIG[type]||TYPE_CONFIG.Business;
  const brand= (prompt.split(/[^A-Za-z0-9À-ÿ]+/).filter(w=>w.length>3)[0]||"BZV").slice(0,15);
  const brandCap=brand.charAt(0).toUpperCase()+brand.slice(1);
  const cleanPrompt=escapeHTML(prompt).slice(0,200);
  return `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${brandCap} - ${type}</title><script src="https://cdn.tailwindcss.com"><\/script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;600&display=swap" rel="stylesheet"><style>*{font-family:'Inter',sans-serif}h1{font-family:'Playfair Display',serif}</style></head><body class="bg-[#FFFEFB]"><nav class="fixed top-0 w-full bg-white/80 backdrop-blur border-b p-4 flex justify-between"><span>${cfg.emoji} ${brandCap.toUpperCase()} DE LUXE</span><button class="bg-black text-white px-4 py-1 text-sm">${cfg.cta}</button></nav><section class="pt-24 p-8 max-w-6xl mx-auto grid md:grid-cols-2 gap-8 items-center"><div><p class="text-amber-600 text-xs tracking-widest">BRAZZAVILLE</p><h1 class="text-6xl font-black">${brandCap}<br><span class="bg-gradient-to-r ${cfg.colors} bg-clip-text text-transparent">${type}</span></h1><p class="mt-4 text-slate-600">${cleanPrompt} - ${cfg.tagline}</p><button class="mt-6 bg-black text-white px-8 py-3">${cfg.cta}</button></div><img src="https://images.unsplash.com/photo-${getUnsplashPhotoId(type,0)}?w=800&h=1000&fit=crop" class="h-[500px] object-cover rounded-3xl w-full"></section><section class="bg-[#F5F1E8] p-8 grid md:grid-cols-3 gap-4 max-w-6xl mx-auto">${cfg.features.map(f=>`<div class="bg-white p-6 rounded-xl"><div class="text-2xl">${f.icon}</div><h3 class="font-bold mt-2">${f.title}</h3><p class="text-sm text-slate-500">${f.desc}</p></div>`).join('')}</section></body></html>`;
}
async function generateSite(){
  const prompt=document.getElementById("promptInput").value.trim();
  const type=document.getElementById("siteType").value;
  if(!prompt){toast("Décris ton idée");return;}
  updateProgress(20,"Analyse...");
  await new Promise(r=>setTimeout(r,300));
  updateProgress(60,"Génération...");
  const html=generateSiteHTML(prompt,type);
  state.html=html;
  document.getElementById("sitePreview").srcdoc=html;
  document.getElementById("previewSection").classList.remove("hidden");
  document.getElementById("deploy").classList.remove("hidden");
  updateProgress(100,"Terminé !");
  toast("Site généré avec succès","success");
}
function downloadHTML(){if(!state.html){toast("Génère d'abord");return}const b=new Blob([state.html],{type:"text/html"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="index.html";a.click()}
function openPreviewFullscreen(){const w=window.open();w.document.write(state.html);w.document.close()}
</script>
</body>
</html>
